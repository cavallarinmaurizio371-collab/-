intrinsics:
  prefer_calibrated: true
  calibrated_file: configs/camera_intrinsics_phase2a.json
  fallback_file: configs/camera_intrinsics.json
pnp:
  max_reprojection_rmse_px: 25.0
axis:
  max_residual_m: 0.012
  minimum_linearity: 0.70
anchor:
  mode: V2_POOLED_ROBUST
  landmark_name: MIDDLE_MCP
  landmark_index: 9
  sample_landmark_indices: [0, 5, 9, 13, 17]
  patch_size: 7
  minimum_valid_samples: 3
  max_depth_mad_m: 0.04
  lower_percentile: 10
  upper_percentile: 90
  outlier_mad_scale: 3.5
anchor_temporal:
  enabled: true
  ema_alpha: 0.3
  max_jump_m: 0.10
  max_invalid_frames: 5
temporal:
  enabled: true
  ema_alpha: 0.35
  max_angle_jump_deg: 20.0
runtime:
  capture_seconds: 4.0
  trials_per_pose: 3
  direction_mode: C_AXIS_FIT
  output_root: reports/phase2a5_sessions
